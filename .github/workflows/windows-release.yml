name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version is derived from the pushed tag (v1.0.0 -> 1.0.0) so the
      # installer, the artifact and the release name can never drift out of
      # sync with each other the way hardcoded copies did.
      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/*') {
            $v = $ref -replace '^refs/tags/v?', ''
          } else {
            $v = '0.0.0-dev'
          }
          # Numeric-only form for Inno/Flutter build-name (strips any -beta).
          $num = ($v -replace '[-+].*$', '')
          "version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$num"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v (numeric $num)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify app version matches the tag
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.numeric }}"
          $src = Get-Content lib/main.dart -Raw
          if ($src -notmatch "_kAppVersion\s*=\s*'([^']+)'") {
            Write-Error "Could not find _kAppVersion in lib/main.dart"; exit 1
          }
          $app = ($Matches[1] -replace '[-+].*$', '')
          if ($app -ne $tag) {
            Write-Error "Tag v$tag does not match _kAppVersion '$($Matches[1])' in lib/main.dart. The updater compares against _kAppVersion, so a mismatch would make installed copies mis-detect updates."
            exit 1
          }
          Write-Host "Version check passed: $app"

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ steps.ver.outputs.numeric }} --build-number=1

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.numeric }}"
          $script = @"
          [Setup]
          AppName=Dose Estimate
          AppVersion=$v
          AppPublisher=742 CHP
          DefaultDirName={userpf}\DoseEstimate
          DefaultGroupName=Dose Estimate
          OutputBaseFilename=DoseEstimate-$v-Setup
          OutputDir=installer
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          DisableProgramGroupPage=yes
          UninstallDisplayName=Dose Estimate

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\Dose Estimate"; Filename: "{app}\DoseEstimate.exe"
          Name: "{userdesktop}\Dose Estimate"; Filename: "{app}\DoseEstimate.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\DoseEstimate.exe"; Description: "Launch Dose Estimate"; Flags: nowait postinstall skipifsilent
          "@
          $script | Out-File -FilePath setup.iss -Encoding UTF8

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoseEstimate-${{ steps.ver.outputs.numeric }}-Windows
          path: installer/DoseEstimate-${{ steps.ver.outputs.numeric }}-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Dose Estimate ${{ steps.ver.outputs.numeric }}"
          body: |
            ## Dose Estimate — Version ${{ steps.ver.outputs.numeric }}

            First general release. If you are running any Beta build, please
            **uninstall it and install this version** — beta builds will not
            prompt you to update to this release.

            ### Corrections in this release
            - **Surface contamination categories (10 CFR 835 Appendix D):** alpha
              emitters that are not named explicitly in the regulation — Po-210,
              Pb-210, Th-229, U-233, Sm-147, Gd-148, Th-227, Ra-225, U-230 — were
              being classified as beta-gamma emitters at 1,000 dpm/100 cm²
              instead of 20 dpm/100 cm². This made the ALARA removable-
              contamination trigger 50× less conservative for those nuclides.
            - **Extremity ring dosimetry** now triggers at 500 mrem individual
              extremity dose. It was set to 5,000 mrem, duplicating the ALARA
              extremity review threshold, so a ring was only called for at ten
              times the intended dose.

            ### Report improvements
            - The dose summary now flows onto a continuation page when needed.
              Previously, on a report with many triggers, the task summary table
              and the signature block could be pushed off the page and silently
              omitted.
            - Large collective-dose values no longer wrap mid-number in the task
              summary table.
            - Trigger override justifications name the trigger in full instead of
              printing an internal key.
            - Signature block prints only when an ALARA review trigger has fired;
              routine estimates no longer carry empty sign-off lines.
            - Signature roles now read "Preparer / Health Physicist" and
              "Peer check / HP or Manager".
            - The containment report also flows across pages, so a long source
              term can no longer push the containment verdict off the sheet.
            - Fixed characters that printed as empty boxes in both reports.

            ### Verification
            - The calculation engine is cross-checked in the test suite against
              every hand calculation in the RPP-742 QA workbook (TC-01–TC-41).
            - 45 automated tests run on every release build.

            ### Installation
            1. Download `DoseEstimate-${{ steps.ver.outputs.numeric }}-Setup.exe`
            2. Run the installer — **no admin rights required**
            3. A desktop shortcut will be created automatically

            ### Notes
            - Installs to your personal user folder (no system-wide install needed)
            - Windows 10 or later recommended
          files: installer/DoseEstimate-${{ steps.ver.outputs.numeric }}-Setup.exe
          draft: false
          prerelease: false
